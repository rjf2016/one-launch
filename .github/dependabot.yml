version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      electron:
        patterns:
          - electron
          - electron-builder
          - electron-updater
      # A vite major moves together with electron-vite and @vitejs/plugin-react, whose peer ranges pin it; bumped alone, each fails npm ci with ERESOLVE.
      vite:
        patterns:
          - vite
          - '@vitejs/*'
          - electron-vite

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
