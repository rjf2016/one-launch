name: Release

# A pushed v<version> tag builds the installer and leaves it in a draft release whose notes are the version's What's New
# entry. Nothing reaches users until the owner signs latest.yml offline (npm run release:sign) and publishes the draft;
# see docs/development.md, "Releases".
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache: a release build installs from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The tag names this version and is on master
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match the package.json version $version" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME is not on master" }
      - run: npm ci
      # The entry is the release's notes, so a version without one stops here, before the build.
      - name: Release notes from the What's New entry
        shell: pwsh
        run: |
          $notes = Join-Path $env:RUNNER_TEMP release-notes.md
          node scripts/release-notes.mjs $env:GITHUB_REF_NAME "--out=$notes"
      # Electron has no install script: its binary is fetched on the first import of the package. Fetch it here, not inside a vitest worker mid-suite.
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      - run: npx electron-vite build
      - name: Fake-launcher and update-feed runs
        run: |
          node scripts/drive.mjs scripts/scenarios/play-all.mjs --fake --shots=drive-out/play-all
          node scripts/drive.mjs scripts/scenarios/first-run.mjs --fake=none --shots=drive-out/first-run
          node scripts/drive.mjs scripts/scenarios/update.mjs --fake=none --shots=drive-out/update
      - run: npm run notices
      - name: Package (installer)
        run: npx electron-builder --win nsis --publish never
      - name: Packaged smoke run
        run: node scripts/smoke-packaged.mjs --shots=drive-out/packaged-smoke
      - name: Build provenance for the installer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/OneLaunch-*-setup.exe
      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "dist/OneLaunch-$version-setup.exe"
          $files = @($installer, "$installer.blockmap", 'dist/latest.yml')
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "$f is missing" } }
          gh release create $env:GITHUB_REF_NAME @files --draft --verify-tag --title "One Launch $version" --notes-file (Join-Path $env:RUNNER_TEMP release-notes.md)
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
      - name: Upload the driver output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drive-output
          path: drive-out/**
          if-no-files-found: ignore
          retention-days: 7
